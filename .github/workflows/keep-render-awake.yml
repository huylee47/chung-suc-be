name: Keep Render API awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend health endpoint
        env:
          # Set repository variable RENDER_KEEPALIVE_URL to change this without a commit.
          KEEPALIVE_URL: ${{ vars.RENDER_KEEPALIVE_URL || 'https://chung-suc-be.onrender.com/health' }}
        run: |
          curl --fail --show-error --silent --location \
            --retry 2 --retry-all-errors --connect-timeout 20 --max-time 110 \
            "$KEEPALIVE_URL"
